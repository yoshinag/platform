<!DOCTYPE html>
<html lang="ja">
<head>
    <script src="../roulette/js/analytics.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シングルドラムルーレット | iroirotool</title>
    <meta name="description" content="スロット形式のドラム型ルーレットです。スムーズな回転と奥行きのある描画で抽選を演出します。">
    <meta name="keywords" content="ドラムルーレット,スロットルーレット,抽選,ランダム決定,ツール,iroirotool">
    <meta property="og:title" content="シングルドラムルーレット | iroirotool">
    <meta property="og:description" content="スロットのようなドラム型ルーレットツール。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://iroirotool.com/roulette/single_drum.html">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="css/style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1932463298924191"
            crossorigin="anonymous"></script>
</head>
<body>

<div class="container">
    <div class="navigation-links">
        <a href="index.html">ルーレットツール一覧へ戻る</a>
    </div>
    <h1 class="visually-hidden">シングルドラムルーレット</h1>
    <div class="roulette-container">
        <div class="roulette-section" id="drum1">
            <div class="result-container">
                <div class="result">結果: -</div>
            </div>
            <div class="drum-wrapper">
                <div class="drum-window">
                    <canvas width="200" height="200"></canvas>
                    <div class="drum-indicator"></div>
                    <div class="drum-shadow-top"></div>
                    <div class="drum-shadow-bottom"></div>
                </div>
            </div>
            <div class="controls">
                <div class="button-group">
                    <button id="spinBtn">ドラムを回す！</button>
                </div>
                <button class="remove-btn" style="display: none; margin-bottom: 20px;">この項目を除去</button>

                <div class="settings-panel" id="settingsPanel">
                    <div class="settings-header" onclick="document.getElementById('settingsPanel').classList.toggle('open')">
                        設定
                    </div>
                    <div class="settings-content">
                        <div class="input-group">
                            <label>ドラムの幅: <span id="widthValue">200</span>px</label>
                            <input type="range" id="widthRange" min="150" max="600" value="200">
                        </div>
                        <div class="input-group">
                            <label>ドラムの高さ: <span id="heightValue">200</span>px</label>
                            <input type="range" id="heightRange" min="200" max="800" value="200">
                        </div>
                        <div class="input-group">
                            <label><input type="checkbox" class="spin-shuffle" checked> シャッフルしてから回す</label>
                        </div>
                        <div class="input-group">
                            <label><input type="checkbox" class="auto-shuffle" checked> 除去後に自動でシャッフル</label>
                        </div>
                        <div class="input-group">
                            <label>ドラム項目 (1行に1項目):</label>
                            <textarea placeholder="項目A&#10;項目B&#10;項目C"></textarea>
                            <div style="margin-top: 5px;">
                                <input type="file" class="image-upload" accept="image/*" multiple style="display: none;" id="imageUpload">
                                <button class="secondary" onclick="document.getElementById('imageUpload').click()">画像をアップロード</button>
                                <button class="shuffle-btn secondary">順序をシャッフル</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://github.com/yoshinag/rouletteJS/releases/download/1.0/roulette.core.min.js"></script>
<script src="https://github.com/yoshinag/rouletteJS/releases/download/1.0/roulette.drum.min.js"></script>
<script>
    (async () => {
        const defaultText = await loadDefaultItems();
        document.querySelectorAll('textarea').forEach(ta => ta.value = defaultText);

        const d1 = new Drum('drum1', globalColors);
        d1.setRandomPosition();
        const spinBtn = document.getElementById('spinBtn');
        const widthRange = document.getElementById('widthRange');
        const heightRange = document.getElementById('heightRange');
        const widthValue = document.getElementById('widthValue');
        const heightValue = document.getElementById('heightValue');

        widthRange.addEventListener('input', () => {
            const val = widthRange.value;
            widthValue.textContent = val;
            d1.setSize(parseInt(val), d1.height);
        });

        heightRange.addEventListener('input', () => {
            const val = heightRange.value;
            heightValue.textContent = val;
            d1.setSize(d1.width, parseInt(val));
        });

        spinBtn.addEventListener('click', async () => {
            spinBtn.disabled = true;
            await d1.spin();
            spinBtn.disabled = false;
        });
    })();
</script>

</body>
</html>
