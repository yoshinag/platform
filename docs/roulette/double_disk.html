<!DOCTYPE html>
<html lang="ja">
<head>
    <script src="../roulette/js/analytics.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダブルディスクルーレット | iroirotool</title>
    <meta name="description" content="2つの項目を同時に、または個別に抽選できるダブルディスクルーレットです。組み合わせの決定などに。">
    <meta name="keywords" content="ダブルルーレット,二重ルーレット,抽選,ランダム決定,ツール,iroirotool">
    <meta property="og:title" content="ダブルディスクルーレット | iroirotool">
    <meta property="og:description" content="2つのディスクを回せる便利なルーレットツール。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://iroirotool.com/roulette/double_disk.html">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="css/style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1932463298924191"
            crossorigin="anonymous"></script>
</head>
<body>

<div class="container">
    <div class="navigation-links">
        <a href="index.html">ルーレットツール一覧へ戻る</a>
    </div>
    <h1 class="visually-hidden">ダブルディスクルーレット</h1>
    <div class="roulette-container">
        <!-- ルーレット 1 -->
        <div class="roulette-section" id="roulette1">
            <div class="result-container">
                <div class="result">結果: -</div>
            </div>
            <div class="roulette-wrapper">
                <div class="pointer"></div>
                <canvas width="300" height="300"></canvas>
            </div>
            <div class="controls">
                <div class="button-group">
                    <button id="spin1Btn" class="secondary">1 だけ回す</button>
                </div>
                <button class="remove-btn" style="display: none; margin-bottom: 20px;">この項目を除去</button>

                <div class="settings-panel" id="settingsPanel1">
                    <div class="settings-header" onclick="document.getElementById('settingsPanel1').classList.toggle('open')">
                        ルーレット 1 設定
                    </div>
                    <div class="settings-content">
                        <div class="input-group">
                            <label>サイズ: <span class="sizeValue">300</span>px</label>
                            <input type="range" class="sizeRange" min="200" max="800" value="300">
                        </div>
                        <div class="input-group">
                            <label>ルーレット 1 項目:</label>
                            <textarea placeholder="項目A&#10;項目B&#10;項目C"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ルーレット 2 -->
        <div class="roulette-section" id="roulette2">
            <div class="result-container">
                <div class="result">結果: -</div>
            </div>
            <div class="roulette-wrapper">
                <div class="pointer"></div>
                <canvas width="300" height="300"></canvas>
            </div>
            <div class="controls">
                <div class="button-group">
                    <button id="spin2Btn" class="secondary">2 だけ回す</button>
                </div>
                <button class="remove-btn" style="display: none; margin-bottom: 20px;">この項目を除去</button>

                <div class="settings-panel" id="settingsPanel2">
                    <div class="settings-header" onclick="document.getElementById('settingsPanel2').classList.toggle('open')">
                        ルーレット 2 設定
                    </div>
                    <div class="settings-content">
                        <div class="input-group">
                            <label>サイズ: <span class="sizeValue">300</span>px</label>
                            <input type="range" class="sizeRange" min="200" max="800" value="300">
                        </div>
                        <div class="input-group">
                            <label>ルーレット 2 項目:</label>
                            <textarea placeholder="項目1&#10;項目2&#10;項目3"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="button-group">
        <button id="spinBothBtn">両方回す！</button>
    </div>
</div>

<script src="js/roulette.js"></script>
<script>
    (async () => {
        const defaultText = await loadDefaultItems();
        document.querySelectorAll('textarea').forEach(ta => ta.value = defaultText);

        const r1 = new Roulette('roulette1', globalColors);
        const r2 = new Roulette('roulette2', globalColors);
        r1.setRandomPosition();
        r2.setRandomPosition();

        // サイズ変更イベントの設定
        [r1, r2].forEach((r, i) => {
            const section = document.getElementById(`roulette${i + 1}`);
            const sizeRange = section.querySelector('.sizeRange');
            const sizeValue = section.querySelector('.sizeValue');

            sizeRange.addEventListener('input', () => {
                const val = sizeRange.value;
                sizeValue.textContent = val;
                r.setSize(parseInt(val), parseInt(val));
            });
        });

        const spinBothBtn = document.getElementById('spinBothBtn');
        const spin1Btn = document.getElementById('spin1Btn');
        const spin2Btn = document.getElementById('spin2Btn');

        spinBothBtn.addEventListener('click', async () => {
            spinBothBtn.disabled = true;
            spin1Btn.disabled = true;
            spin2Btn.disabled = true;
            await Promise.all([r1.spin(), r2.spin()]);
            spinBothBtn.disabled = false;
            spin1Btn.disabled = false;
            spin2Btn.disabled = false;
        });

        spin1Btn.addEventListener('click', async () => {
            spinBothBtn.disabled = true;
            spin1Btn.disabled = true;
            await r1.spin();
            if (!r2.isSpinning) {
                spinBothBtn.disabled = false;
                spin1Btn.disabled = false;
            }
        });

        spin2Btn.addEventListener('click', async () => {
            spinBothBtn.disabled = true;
            spin2Btn.disabled = true;
            await r2.spin();
            if (!r1.isSpinning) {
                spinBothBtn.disabled = false;
                spin2Btn.disabled = false;
            }
        });
    })();
</script>

</body>
</html>
