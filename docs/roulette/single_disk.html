<!DOCTYPE html>
<html lang="ja">
<head>
    <script src="../roulette/js/analytics.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シングルディスクルーレット | iroirotool</title>
    <meta name="description" content="項目を自由に追加できる、シンプルで使いやすい円盤型ルーレット（ディスクルーレット）です。抽選や決定に最適。">
    <meta name="keywords" content="ルーレット,ディスクルーレット,抽選,ランダム決定,ツール,iroirotool">
    <meta property="og:title" content="シングルディスクルーレット | iroirotool">
    <meta property="og:description" content="項目を自由に追加できる、シンプルで使いやすい円盤型ルーレット。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://iroirotool.com/roulette/single_disk.html">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="css/style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1932463298924191"
            crossorigin="anonymous"></script>
</head>
<body>

<div class="container">
    <div class="navigation-links">
        <a href="index.html">ルーレットツール一覧へ戻る</a>
    </div>
    <h1 class="visually-hidden">シングルディスクルーレット</h1>
    <div class="roulette-container">
        <div class="roulette-section" id="roulette1">
            <div class="result-container">
                <div class="result">結果: -</div>
            </div>
            <div class="roulette-wrapper">
                <div class="pointer"></div>
                <canvas width="300" height="300"></canvas>
            </div>
            <div class="controls">
                <div class="button-group">
                    <button id="spinBtn">ルーレットを回す！</button>
                </div>
                <button class="remove-btn" style="display: none; margin-bottom: 20px;">この項目を除去</button>

                <div class="settings-panel" id="settingsPanel">
                    <div class="settings-header" onclick="document.getElementById('settingsPanel').classList.toggle('open')">
                        設定
                    </div>
                    <div class="settings-content">
                        <div class="input-group">
                            <label>サイズ: <span id="sizeValue">300</span>px</label>
                            <input type="range" id="sizeRange" min="200" max="800" value="300">
                        </div>
                        <div class="input-group">
                            <label>ルーレット項目 (1行に1項目):</label>
                            <textarea placeholder="項目A&#10;項目B&#10;項目C"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/roulette.js"></script>
<script>
    (async () => {
        const defaultText = await loadDefaultItems();
        document.querySelectorAll('textarea').forEach(ta => ta.value = defaultText);

        const r1 = new Roulette('roulette1', globalColors);
        const spinBtn = document.getElementById('spinBtn');
        const sizeRange = document.getElementById('sizeRange');
        const sizeValue = document.getElementById('sizeValue');

        sizeRange.addEventListener('input', () => {
            const val = sizeRange.value;
            sizeValue.textContent = val;
            r1.setSize(parseInt(val), parseInt(val));
        });

        spinBtn.addEventListener('click', async () => {
            spinBtn.disabled = true;
            await r1.spin();
            spinBtn.disabled = false;
        });
    })();
</script>

</body>
</html>
