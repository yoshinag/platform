<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Unicode Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }
        button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #2980b9;
        }
        pre {
            background-color: #f8f8f8;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            border: 1px solid #ddd;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>JWT Unicode Test</h1>
        <button id="runTestBtn">Run Unicode Test</button>
        <pre id="testResults">Test results will appear here...</pre>
    </div>

    <!-- Include the JWT script -->
    <script src="js/jwt.js"></script>
    
    <!-- Include the test script -->
    <script src="js/test_unicode.js"></script>
    
    <script>
        // Create mock DOM elements for testing
        // These would normally be created by the JWT page
        if (!window.headerInput) {
            window.headerInput = { value: '' };
            window.payloadInput = { value: '' };
            window.secretInput = { value: '' };
            window.tokenOutput = { value: '' };
            window.jwtInput = { value: '' };
            window.headerOutput = { value: '' };
            window.payloadOutput = { value: '' };
            window.signatureOutput = { value: '' };
        }
        
        // Override console.log to display in the pre element
        const originalLog = console.log;
        const originalError = console.error;
        const testResults = document.getElementById('testResults');
        
        console.log = function() {
            const args = Array.from(arguments);
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : arg
            ).join(' ');
            
            testResults.innerHTML += message + '\n';
            originalLog.apply(console, arguments);
        };
        
        console.error = function() {
            const args = Array.from(arguments);
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : arg
            ).join(' ');
            
            testResults.innerHTML += '<span class="error">' + message + '</span>\n';
            originalError.apply(console, arguments);
        };
        
        // Add event listener to run test button
        document.getElementById('runTestBtn').addEventListener('click', function() {
            testResults.innerHTML = ''; // Clear previous results
            testUnicodeSupport().then(() => {
                if (!testResults.innerHTML.includes('error')) {
                    testResults.innerHTML += '<span class="success">All tests completed successfully!</span>\n';
                }
            }).catch(error => {
                console.error('Test failed with error:', error);
            });
        });
    </script>
</body>
</html>
