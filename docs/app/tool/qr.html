<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google Analytics -->
    <script src="../js/common/analytics.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL → QR コード生成ツール</title>
    <link rel="stylesheet" href="css/qr.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1932463298924191"
            crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
    <div class="navigation-links">
        <a href="../index.html">アプリトップへ戻る</a>
    </div>
    <h1>URL → QR コード生成ツール</h1>

    <details open>
        <summary>使用方法</summary>
        <ol>
            <li>URL（または任意のテキスト）を入力すると、QR コードが自動生成されます。</li>
            <li>サイズ・誤り訂正レベル・前景色 / 背景色・余白（quiet zone）を調整できます。</li>
            <li>PNG または SVG としてダウンロードできます。SVG は拡大しても劣化しません。</li>
            <li>入力内容はサーバーに送信されず、すべての処理はブラウザ上で完結します。</li>
        </ol>
    </details>

    <div class="input-area">
        <label for="urlInput" class="input-label">URL / テキスト</label>
        <textarea id="urlInput" rows="3" placeholder="https://example.com/" spellcheck="false"></textarea>
        <div class="input-meta">
            <span id="charCount">0 文字</span>
            <span id="errorMessage" class="error" hidden></span>
        </div>
    </div>

    <div class="controls">
        <div class="control-row">
            <label>
                サイズ (px)
                <input type="number" id="sizeInput" min="64" max="2048" step="16" value="320">
            </label>
            <label>
                誤り訂正
                <select id="ecLevel">
                    <option value="L">L (約 7%)</option>
                    <option value="M" selected>M (約 15%)</option>
                    <option value="Q">Q (約 25%)</option>
                    <option value="H">H (約 30%)</option>
                </select>
            </label>
            <label>
                余白 (モジュール)
                <input type="number" id="marginInput" min="0" max="16" step="1" value="4">
            </label>
        </div>
        <div class="control-row">
            <label>
                前景色
                <input type="color" id="fgColor" value="#000000">
            </label>
            <label>
                背景色
                <input type="color" id="bgColor" value="#ffffff">
                <input type="checkbox" id="bgTransparent">
                <span>透過</span>
            </label>
        </div>
    </div>

    <div class="preview-area">
        <div class="preview-box" id="previewBox">
            <p class="placeholder">URL を入力すると、ここに QR コードが表示されます。</p>
        </div>
        <div class="download-buttons">
            <button id="downloadPngBtn" disabled>PNG ダウンロード</button>
            <button id="downloadSvgBtn" disabled>SVG ダウンロード</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="js/qr.js"></script>
</body>
</html>
